name: Legado Android CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Download and setup Gradle Wrapper
      run: |
        # 检查Gradle Wrapper是否完整
        if [ ! -f gradlew ]; then
          echo "❌ gradlew not found, downloading..."
          curl -L https://raw.githubusercontent.com/gradle/gradle/master/gradlew > gradlew
          chmod +x gradlew
        fi
        
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "❌ gradle-wrapper.jar not found, downloading..."
          mkdir -p gradle/wrapper
          curl -L https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi
        
        if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
          echo "❌ gradle-wrapper.properties not found, downloading..."
          curl -L https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
        fi
        
        # 验证Gradle Wrapper
        echo "✅ Gradle Wrapper files downloaded"
        ls -la gradle/wrapper/
        chmod +x gradlew

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Release APK
      id: sign_apk
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release-unsigned-signed.apk

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Run Instrumentation Tests
      run: ./gradlew connectedAndroidTest
      continue-on-error: true

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: app/build/reports/tests/

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Run Kotlin Lint
      run: ./gradlew ktlintCheck

    - name: Run Detekt
      run: ./gradlew detekt

    - name: Run Android Lint
      run: ./gradlew lint

    - name: Upload Lint Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: lint-reports
        path: app/build/reports/

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Safety Check
      run: |
        python -m pip install safety
        safety check --full-report

    - name: Run Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'Legado'
        format: 'HTML'
        outfile: 'dependency-check-report.html'

    - name: Upload Security Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: dependency-check-report.html

  deploy:
    needs: [build, lint, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download APK artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/debug-apk/app-debug.apk
          artifacts/release-apk/app-release-unsigned-signed.apk
        draft: false
        prerelease: false
        tag_name: v${{ github.run_number }}
        name: Legado v${{ github.run_number }}
        body: |
          ## Legado Android Reader v${{ github.run_number }}

          ### Features
          - Complete reading experience with Material You design
          - AI-powered table of contents generation
          - Ad filtering and content purification
          - TTS audio reading functionality
          - Cloud sync for reading progress and bookmarks
          - Community features for book reviews and recommendations

          ### Downloads
          - **Debug APK**: For testing purposes
          - **Release APK**: Production build (signed)

          ### Installation
          1. Enable "Install from unknown sources" in Settings > Security
          2. Open the downloaded APK file
          3. Follow the installation prompts

          ---
          Generated by GitHub Actions CI/CD Pipeline
      token: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Google Play Internal Track
      if: success()
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.legado.reader
        releaseFiles: artifacts/release-apk/app-release-unsigned-signed.apk
        track: internal